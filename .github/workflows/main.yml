name: Telegram Notification

on: [push]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Message to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }},${{ secrets.GROUP_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚀 **Новый пуш в репозиторий!**
            
            👤 **Автор:** @${{ github.actor }}
            📝 **Коммит:** ${{ github.event.commits[0].message }}
            🔗 [Посмотреть изменения](${{ github.event.compare }})